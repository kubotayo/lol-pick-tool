name: Collect Daily

on:
  # 毎日 JST 02:00（UTC 17:00）に実行
  schedule:
    - cron: '0 17 * * *'
  # 手動実行（パッチ更新後の初回シード収集・デバッグ用）
  workflow_dispatch:
    inputs:
      regions:
        description: '収集対象リージョン（現在は1つのみ対応。将来はカンマ区切りで複数指定予定）'
        required: false
        default: 'jp1'
      tier:
        description: '収集対象ランク帯'
        required: false
        default: 'DIAMOND'

# バッチを同時に1つしか動かさない（同時実行すると同じ試合を二重に加算しようとして、片方の書き込みが全部取り消されるため）
concurrency:
  group: collect-daily
  cancel-in-progress: false

jobs:
  collect:
    name: データ収集・集計
    runs-on: ubuntu-latest
    # Riot API レート制限を考慮し最大6時間まで許容する
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存パッケージをインストール
        run: npm ci --legacy-peer-deps

      - name: データ収集スクリプトを実行
        run: npm run collect
        env:
          RIOT_API_KEY:              ${{ secrets.RIOT_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_REGIONS:            ${{ github.event.inputs.regions || 'jp1' }}
          TARGET_TIER:               ${{ github.event.inputs.tier || 'DIAMOND' }}
          # 時間上限（分）。timeout-minutes: 360 に達する前に止めて DB に書き込むため、30分の余裕を残す
          MAX_DURATION_MINUTES:      '330'
